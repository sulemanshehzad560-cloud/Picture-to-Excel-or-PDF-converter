name: Build Android app

# Builds the OmniScan APK (install on your phone) and AAB (upload to Google Play).
# Pushes to main also publish a GitHub Release with both files attached.
#
# Release signing uses four repository secrets (Settings > Secrets and variables > Actions):
#   OMNISCAN_KEYSTORE_BASE64   base64 of your upload keystore (.jks)
#   OMNISCAN_KEYSTORE_PASSWORD keystore password
#   OMNISCAN_KEY_ALIAS         key alias (omniscan)
#   OMNISCAN_KEY_PASSWORD      key password
# Without them the workflow still builds an installable debug-signed APK for personal use.

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run models
      - name: Unit + engine tests (on-device OCR, exporters)
        run: npm test

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  android:
    needs: web-tests
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - name: Build web app (downloads and verifies the OCR models)
        run: npm run build
      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.OMNISCAN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "keystore=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
            echo "Release signing: enabled"
          else
            echo "Release signing: no secrets set, building a debug-signed APK only"
          fi

      - name: Build signed release APK + AAB
        if: steps.signing.outputs.keystore != ''
        working-directory: android
        env:
          OMNISCAN_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          OMNISCAN_KEYSTORE_PASSWORD: ${{ secrets.OMNISCAN_KEYSTORE_PASSWORD }}
          OMNISCAN_KEY_ALIAS: ${{ secrets.OMNISCAN_KEY_ALIAS }}
          OMNISCAN_KEY_PASSWORD: ${{ secrets.OMNISCAN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/OmniScan-$VERSION_NAME.apk
          cp app/build/outputs/bundle/release/app-release.aab ../out/OmniScan-$VERSION_NAME.aab

      - name: Build debug APK (no signing secrets)
        if: steps.signing.outputs.keystore == ''
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/OmniScan-$VERSION_NAME-debug.apk

      - name: Check the APK
        run: |
          APK=$(ls out/*.apk | head -1)
          ls -la out
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|uses-permission"
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          unzip -l "$APK" | grep -E "assets/public/(models|ort)/"

      - uses: actions/upload-artifact@v5
        with:
          name: OmniScan-${{ env.VERSION_NAME }}
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION_NAME"
          NOTES="OmniScan $VERSION_NAME: offline handwriting and document scanner.

          - **APK**: install directly on your Android phone (allow installs from this source when asked).
          - **AAB**: upload this file to Google Play Console (only attached when release signing secrets are set).

          Built from ${GITHUB_SHA::7}."
          gh release create "$TAG" out/* --title "OmniScan $VERSION_NAME" --notes "$NOTES" --target "$GITHUB_SHA"
